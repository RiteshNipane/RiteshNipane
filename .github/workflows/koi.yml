name: Draw profile koi

on:
  schedule:
    - cron: '17 0 * * *' # Runs daily just after midnight UTC
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/koi.yml'

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Render profile koi
        uses: yalongwastaken/git-koi@v1
        with:
          body: white      # Options: white, black, asagi, tea, gold, platinum
          output-dir: koi

      - name: Commit the koi if it changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koi/koi.gif
          if ! git diff --cached --quiet; then
            git commit -m "chore: update profile koi"
            git push
          fi
